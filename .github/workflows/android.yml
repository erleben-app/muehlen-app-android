# Mühlen.app für Android als Trusted Web Activity.
# Signiertes AAB und installierbare APK als Artefakt. Die erste Version lädt
# man in der Play Console von Hand hoch; danach geht sie mit
# PLAY_SERVICE_ACCOUNT_JSON direkt in den internen Test.
# Neue Region auf muehlen.app: Workflow einmal starten, die Domainliste
# kommt aus /api/store-app-hosts (TWA kennt keine Wildcards).
# Neue Version: versionCode/versionName in app/build.gradle erhöhen,
# fastlane/metadata/android/{de-DE,en-US}/changelogs/<versionCode>.txt anlegen,
# Tag v<versionName> pushen.
# Secrets: ANDROID_KEYSTORE_BASE64 (PKCS12), ANDROID_KEYSTORE_PASSWORD,
# optional PLAY_SERVICE_ACCOUNT_JSON
name: Android

on:
  # Tag v<versionName> (z. B. v1.0.1): Release mit signiertem APK für IzzyOnDroid
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testbuild:
        description: Testbuild (startet auf /embed/app-check, vertraut zusätzlich den Testdomains)
        type: boolean
        default: false
      smoke:
        description: Rauchtest im Emulator (startet die APK, Logcat und Screenshot als Artefakt)
        type: boolean
        default: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Domainliste erzeugen
        env:
          TWA_EXTRA_HOSTS: ${{ inputs.testbuild && 'stemwede.erleben.app,bergkamen.bergkamen.app,stemwede.siebenecken.app' || '' }}
        run: bun generate-hosts.mjs
      - name: AAB und APK bauen
        env:
          TWA_START_URL: ${{ inputs.testbuild && 'https://milk.muehlen.app/embed/app-check' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.p12"
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: muehlen-app-android
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
      - name: Release mit APK anlegen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "muehlen-app-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "muehlen-app-$GITHUB_REF_NAME.apk" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "fastlane/metadata/android/de-DE/changelogs/$code.txt"
      - name: In den internen Test hochladen
        # Nur bei manuellem Start: ein Tag würde sonst denselben versionCode
        # noch einmal schicken, den Play ablehnt
        if: env.HAS_PLAY_ACCOUNT == 'true' && github.event_name == 'workflow_dispatch' && !inputs.testbuild
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.muehlen
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  smoke:
    needs: bundle
    if: inputs.smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muehlen-app-android
          path: out
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Starten im Emulator (Android 14 mit Play Store und Chrome)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r out/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n app.muehlen/com.google.androidbrowserhelper.trusted.LauncherActivity || true
            sleep 25
            adb exec-out screencap -p > screenshot.png
            adb logcat -d > logcat.txt
            adb shell dumpsys activity activities | grep -i "mResumedActivity\|topResumedActivity" > activity.txt || true
            grep -E "FATAL EXCEPTION|AndroidRuntime|app.muehlen|TwaLauncher|LauncherActivity|chromium" logcat.txt | head -200 > logcat-auszug.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rauchtest
          path: |
            screenshot.png
            logcat.txt
            logcat-auszug.txt
            activity.txt

